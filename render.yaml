# Render "Blueprint": everything Render needs to run the Yield Predictor's web app, in one file (v0.2.0).
# Render reads it when you choose New > Blueprint and pick this GitHub repository.
#
# Cost: $0. Render's free plan (512 MB, sleeps after 15 idle minutes; the first visit after that takes about a minute).
# The free plan's 750 hours a month are shared by every free service in the workspace and only count while one is
# awake, so a fifth app costs hours only when people use it. No database: the app keeps nothing about its visitors.
# The Streamlit app keeps running beside it until the links move (migration step 3).
# Nothing secret is written here: the key is typed into Render's dashboard (sync: false).

services:
  - type: web
    name: yield-predictor
    runtime: docker            # builds the Dockerfile in this repository
    plan: free
    region: oregon             # next to the other apps
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: YIELD_PREDICTOR_HOSTED
        value: "1"             # secure cookies; refuses to start without the settings below
      - key: YIELD_PREDICTOR_MY_FARM_SIGN_IN
        value: "1"             # Sign In With My Farm (optional for visitors: it only brings their county)
      # v0.2.1, the move to cornerpostlogic.com (claude/domain-move-plan.md): this app lives at its own address from the
      # start, so My Farm only ever knows one. v0.2.2: My Farm's own address since 2026-10-12, apps.cornerpostlogic.com.
      - key: YIELD_PREDICTOR_FARM_ACCOUNT_URL
        value: https://apps.cornerpostlogic.com
      - key: YIELD_PREDICTOR_PUBLIC_URL
        value: https://yield.cornerpostlogic.com
      - key: YIELD_PREDICTOR_FARM_ACCOUNT_KEY
        sync: false            # Render asks for it: the same long random string as corn-yield-predictor:<key> in
                               # farm-account's FARM_ACCOUNT_APP_KEYS
